<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        /* По умолчанию (компьютер) — КРАСНЫЙ фон */
        body {
            background-color: red;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        /* Если экран узкий (телефон) — СИНИЙ фон */
        @media (max-width: 768px) {
            body {
                background-color: blue;
            }
        }

        h1 {
            color: white;
        }

        .card {
            background-color: white;
            border: 3px solid black;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 500px;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }

        button {
            background-color: orange;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkorange;
        }

        footer {
            margin-top: 30px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    
</body>
</html>
